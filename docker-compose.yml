services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radioplan}
      POSTGRES_USER: ${POSTGRES_USER:-radioplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build: ./apps/api/RadPlan.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-radioplan};Username=${POSTGRES_USER:-radioplan};Password=${POSTGRES_PASSWORD}
      Encryption__Key: ${ENCRYPTION_KEY:?Set a 32-byte base64 ENCRYPTION_KEY in .env}
      Setup__Token: ${SETUP_TOKEN:?Set a one-time SETUP_TOKEN in .env}
      QuestPdf__License: ${QUESTPDF_LICENSE:-Community}
      DataProtection__Path: /var/lib/radioplan/keys
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, edge]
    volumes:
      - api_keys:/var/lib/radioplan/keys

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api
    depends_on: [api]
    networks: [edge]

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    networks: [edge]

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  api_keys:
